name: Mutation gate

on:
  schedule:
    - cron: "41 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-gate
  cancel-in-progress: false

jobs:
  locked-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Break each locked invariant in an isolated copy
        run: cargo test --test mutation_guard -- --ignored --nocapture
