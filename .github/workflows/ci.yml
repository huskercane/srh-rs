name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Provision and verify the Layer B ACL user
        env:
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          docker exec "$REDIS_CONTAINER" redis-cli ACL SETUSER srh-ci reset on '>ci-password' '~ci:*' +get +set +ping +info +command\|info +multi +exec +discard
          test "$(docker exec --env REDISCLI_AUTH=ci-password "$REDIS_CONTAINER" redis-cli --user srh-ci SET ci:allowed accepted)" = "OK"
          denied=$(docker exec --env REDISCLI_AUTH=ci-password "$REDIS_CONTAINER" redis-cli --user srh-ci SET other:key denied)
          case "$denied" in
            NOPERM*) ;;
            *) echo "expected an ACL NOPERM response, got: $denied" >&2; exit 1 ;;
          esac
      - run: cargo test --all-features

  upstash-parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned Upstash suite
        uses: actions/checkout@v4
        with:
          repository: upstash/redis-js
          # @upstash/redis 1.38.2, released 2026-08-04.
          ref: fc3089b69f583bc2a34bb1c4f9b8871891408cdc
          path: upstash-redis
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: upstash-redis/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2
        with:
          # Match the @types/bun version reviewed in the pinned upstream tree.
          bun-version: 1.3.6
      - name: Install the pinned upstream dependencies
        working-directory: upstash-redis
        run: pnpm install --frozen-lockfile
      - name: Build the release image
        run: docker build --tag srh-rs:ci .
      - name: Verify and retain the static artifact
        run: |
          test "$(docker image inspect srh-rs:ci --format '{{.Config.User}}')" = "nonroot:nonroot"
          test "$(docker image inspect srh-rs:ci --format '{{.Size}}')" -lt 26214400
          container=$(docker create srh-rs:ci)
          docker cp "$container:/usr/local/bin/srh-rs" "$RUNNER_TEMP/srh-rs"
          docker rm "$container"
          docker run --rm --volume "$RUNNER_TEMP/srh-rs:/srh-rs:ro" debian:bookworm-slim \
            sh -c 'output=$(ldd /srh-rs 2>&1 || true); echo "$output"; echo "$output" | grep -Eq "not a dynamic executable|statically linked"'
      - name: Upload the static binary
        uses: actions/upload-artifact@v4
        with:
          name: srh-rs-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/srh-rs
          if-no-files-found: error
      - name: Start Redis Stack and srh-rs
        run: |
          docker network create srh-parity
          docker run --detach --name redis-stack --network srh-parity \
            redis/redis-stack-server@sha256:798ab84d9f266936b034ab11c4d04a2b8e4b441884c5aa7d17ac951eefdf742a
          docker run --detach --name srh --network srh-parity --publish 127.0.0.1:18080:80 \
            --env SRH_MODE=env \
            --env SRH_TOKEN=example_token \
            --env SRH_CONNECTION_STRING=redis://redis-stack:6379 \
            --env SRH_MAX_CONNECTIONS=64 \
            srh-rs:ci
      - name: Prepare the pinned upstream suite
        run: |
          git -C upstash-redis apply ../ci/upstash-parity-policy.patch
          git -C upstash-redis apply ../ci/upstash-parity-protocol.patch
          git -C upstash-redis apply ../ci/upstash-parity-backend.patch
          while IFS= read -r file; do
            echo "parity policy-scope skip: $file"
            mv "upstash-redis/$file" "upstash-redis/$file.policy-scope"
          done < ci/upstash-parity-policy-scope.txt
          while IFS= read -r file; do
            echo "parity documented protocol skip: $file"
            mv "upstash-redis/$file" "upstash-redis/$file.documented-skip"
          done < ci/upstash-parity-skips.txt
          while IFS= read -r file; do
            echo "parity backend-scope skip: $file"
            mv "upstash-redis/$file" "upstash-redis/$file.backend-scope"
          done < ci/upstash-parity-backend-scope.txt
      - name: Wait for the proxy
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs srh
          exit 1
      - name: Run the upstream Bun parity suite
        working-directory: upstash-redis/packages/redis
        env:
          UPSTASH_REDIS_REST_URL: http://127.0.0.1:18080
          UPSTASH_REDIS_REST_TOKEN: example_token
        run: bun test pkg --bail --timeout 20000
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the image by commit and report its digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image="ghcr.io/${{ github.repository }}:${{ github.sha }}"
          docker tag srh-rs:ci "$image"
          docker push "$image"
          docker image inspect "$image" --format '{{index .RepoDigests 0}}'
