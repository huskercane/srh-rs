name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

env:
  BIN_NAME: srh-rs
  TARGET: x86_64-unknown-linux-musl

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a matching Cargo version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          manifest_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$version" = "$manifest_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  binary:
    name: Build static Linux binary
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ env.TARGET }}
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Build and verify the static release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$TARGET"
          strip "target/$TARGET/release/$BIN_NAME"
          output=$(ldd "target/$TARGET/release/$BIN_NAME" 2>&1 || true)
          echo "$output"
          grep -Eq "not a dynamic executable|statically linked" <<<"$output"
      - name: Package binary, service unit, and checksums
        shell: bash
        run: |
          set -euo pipefail
          asset="$BIN_NAME-v${{ needs.validate.outputs.version }}-$TARGET"
          mkdir -p "$asset/deploy" "$asset/srh-config"
          cp "target/$TARGET/release/$BIN_NAME" "$asset/"
          cp deploy/srh-rs.service "$asset/deploy/"
          cp srh-config/tokens.example.json "$asset/srh-config/"
          cp README.md "$asset/"
          tar -czf "$asset.tar.gz" "$asset"
          sha256sum "$asset.tar.gz" > "$asset.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: srh-rs-v${{ needs.validate.outputs.version }}-${{ env.TARGET }}
          path: |
            srh-rs-v${{ needs.validate.outputs.version }}-${{ env.TARGET }}.tar.gz
            srh-rs-v${{ needs.validate.outputs.version }}-${{ env.TARGET }}.tar.gz.sha256
          if-no-files-found: error

  image:
    name: Publish distroless image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the versioned image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}:$GITHUB_REF_NAME"
          docker build --tag "$image" .
          docker push "$image"
          docker image inspect "$image" --format '{{index .RepoDigests 0}}' >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub release
    needs: [validate, binary, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: srh-rs ${{ needs.validate.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
