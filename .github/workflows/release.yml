name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

env:
  BIN_NAME: srh-rs

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a matching Cargo version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          manifest_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$version" = "$manifest_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  binary:
    name: Build ${{ matrix.label }} binary
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fully static. Required by the distroless base, which ships no libc at all,
          # and portable to any host regardless of its glibc version.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            label: static musl
            linkage: static
          # Dynamically linked against glibc, for the systemd deployment. This workload
          # spends roughly a tenth of its CPU in the allocator and musl's mallocng
          # contends far worse across threads than glibc's, so the glibc build is the
          # faster native-host artifact. Built on the oldest supported runner to keep
          # the required glibc version low.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            label: glibc
            linkage: dynamic
    env:
      TARGET: ${{ matrix.target }}
      LINKAGE: ${{ matrix.linkage }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install musl tools
        if: matrix.linkage == 'static'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Build and verify the release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$TARGET"
          binary="target/$TARGET/release/$BIN_NAME"
          strip "$binary"
          output=$(ldd "$binary" 2>&1 || true)
          echo "$output"
          if [[ "$LINKAGE" == "static" ]]; then
            grep -Eq "not a dynamic executable|statically linked" <<<"$output"
          else
            # A silently static "glibc" build would defeat the point of this target, so
            # assert the linkage positively rather than trusting the target triple.
            grep -q "libc.so.6" <<<"$output"
            # Record the glibc floor: this binary will not start on an older host, and
            # that limit is invisible until someone deploys it.
            floor=$(objdump -T "$binary" \
              | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -uV | tail -1 || true)
            test -n "$floor"
            echo "\`$TARGET\` requires **$floor** or newer" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Package binary, service unit, and checksums
        shell: bash
        run: |
          set -euo pipefail
          asset="$BIN_NAME-v${{ needs.validate.outputs.version }}-$TARGET"
          mkdir -p "$asset/deploy" "$asset/srh-config"
          cp "target/$TARGET/release/$BIN_NAME" "$asset/"
          cp deploy/srh-rs.service "$asset/deploy/"
          cp srh-config/tokens.example.json "$asset/srh-config/"
          cp README.md "$asset/"
          tar -czf "$asset.tar.gz" "$asset"
          sha256sum "$asset.tar.gz" > "$asset.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: srh-rs-v${{ needs.validate.outputs.version }}-${{ matrix.target }}
          path: |
            srh-rs-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz
            srh-rs-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  image:
    name: Publish distroless image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the versioned image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}:$GITHUB_REF_NAME"
          docker build --tag "$image" .
          docker push "$image"
          docker image inspect "$image" --format '{{index .RepoDigests 0}}' >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub release
    needs: [validate, binary, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: srh-rs ${{ needs.validate.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
