[package]
name = "srh-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[features]
default = []
testsupport = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bytes = "1"
dashmap = "6"
fred = { version = "10", features = ["enable-rustls-ring"] }
futures-util = "0.3"
hyper = { version = "1", features = ["http1", "server"] }
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "server-graceful", "service", "tokio"] }
jsonwebtoken = "9"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = ["http-listener"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.6", features = ["limit", "trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
zeroize = "1"

[dev-dependencies]
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
testcontainers = "0.23"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
wiremock = "0.6"
